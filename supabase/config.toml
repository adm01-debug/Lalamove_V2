project_id = "iecgydonctmabiijadsf"

# get-mapbox-token: devolve o token Mapbox ao frontend autenticado.
# verify_jwt = true exige sessão Supabase válida; o frontend já envia o JWT
# via supabase.functions.invoke(), portanto nenhuma mudança de código é necessária.
[functions.get-mapbox-token]
verify_jwt = true

# simulate-driver-movement: ferramenta de simulação de dev que escreve em
# active_tracking e tracking_events via service_role. Deve exigir sessão válida
# para evitar que qualquer caller externo injete dados de rastreamento falsos.
[functions.simulate-driver-movement]
verify_jwt = true

# lalamove-api: BFF principal — cria pedidos, cancela, muda motorista, define
# webhook. Sem auth qualquer caller podia criar pedidos pagos ou redirecionar
# todos os webhooks Lalamove. Backend calls com service_role JWT continuam OK.
[functions.lalamove-api]
verify_jwt = true

# send-notification: dispara WhatsApp/email/Slack/Bitrix24/n8n via Evolution e
# Resend. Sem auth qualquer caller podia spam todos os canais configurados.
# Functions internas já chamam com service_role Bearer — JWT válido, sem quebra.
[functions.send-notification]
verify_jwt = true

# route-analyzer: lê GPS, clientes, motoristas e alertas via service_role e
# envia para Lovable AI (LOVABLE_API_KEY com custo por token). Sem auth qualquer
# caller podia exfiltrar dados de entrega e esgotar créditos da API.
[functions.route-analyzer]
verify_jwt = true

# lalamove-uapi: proxy da UAPI Lalamove (tokens de sessão, wallet, pedidos).
# verify_jwt = true já é o default, mas declarado aqui explicitamente porque
# a action set-token aceita tokens de sessão externos — qualquer caller
# autenticado sem check de role poderia sobrescrever a sessão ativa.
# O check de role admin é feito no código da função (requireAdmin).
[functions.lalamove-uapi]
verify_jwt = true

# mcp-query: introspecção e diagnóstico de banco para administradores.
# verify_jwt = false porque a função valida o JWT em código (mesmo padrão
# do migrate-helper); a autorização real é via RPC can_run_db_diagnostics.
[functions.mcp-query]
verify_jwt = false

# lalamove-webhook: receptor dos webhooks da Lalamove (ORDER_STATUS_CHANGED,
# DRIVER_ASSIGNED, WALLET_BALANCE_CHANGED...). A Lalamove NÃO envia JWT
# Supabase — com verify_jwt = true todo webhook morreria com 401 antes de
# chegar no código. A autenticidade é validada em código pela assinatura
# HMAC-SHA256 no body (security.ts).
[functions.lalamove-webhook]
verify_jwt = false

# llm-wh: alias/receptor alternativo de webhook (mesma razão: caller externo
# sem JWT Supabase; validação por assinatura no código).
[functions.llm-wh]
verify_jwt = false

# job-worker: processa a job_queue. Invocado por pg_cron/chamadas internas
# com Bearer service_role — passa no verify_jwt. Nenhum caller anônimo deve
# conseguir disparar o worker.
[functions.job-worker]
verify_jwt = true

# lalamove-gateway: gateway interno para a API v3 (assinatura HMAC das
# requests). Só é chamado por functions internas/frontend autenticado.
[functions.lalamove-gateway]
verify_jwt = true

# lalamove-token-refresh: renova o token de sessão da UAPI. Invocado por
# pg_cron com Bearer service_role.
[functions.lalamove-token-refresh]
verify_jwt = true

# bitrix24-sync: sincroniza pedidos com o Bitrix24. Chamado por functions
# internas/n8n com Bearer service_role.
[functions.bitrix24-sync]
verify_jwt = true

# geo-gateway: camada única de acesso a provedores de mapa (Mapbox/Google) — lê geo_settings, mede
# custo em geo_usage e usa o token Mapbox de servidor. Sem auth qualquer caller gastaria a cota paga.
# O front chama via supabase.functions.invoke() (JWT da sessão); edges internas usam service_role.
[functions.geo-gateway]
verify_jwt = true

# geo-admin: roda a etapa 9 do plano Mapbox (rotacao do token de servidor via Tokens API).
# Cunha e revoga credenciais que determinam a fatura da Mapbox, entao nunca e anonima — a
# function ainda recheca admin/manager em user_roles alem do verify_jwt.
[functions.geo-admin]
verify_jwt = true

# mapbox-proxy: REMOVIDA do repo na etapa 61 (arquivo apagado). O bloco [functions.mapbox-proxy]
# nao pode existir aqui: `supabase functions deploy` (sem nome) le o config.toml e tenta empacotar
# toda function declarada — com o diretorio ausente o deploy inteiro falha com "entrypoint path
# does not exist". A function ainda esta deployada em producao (sem chamador) e sera removida la
# quando autorizado; remover do painel nao depende deste arquivo.

# telemetry-csp-report: coletor do header Content-Security-Policy-Report-Only de vercel.json.
# O navegador nao envia JWT em relatorio de CSP, entao a funcao e publica por natureza; o
# limite de corpo (8 KB), o rate limit por IP e a ausencia de persistencia estao no codigo.
[functions.telemetry-csp-report]
verify_jwt = false
