# docs:
#   gatilho: agendado (seg 09:37 UTC) e dispatch
#   prova: inventario/estado (rotas, edges e, com token, banco) regerado do codigo e do banco oficial
#   falha: o job fica vermelho e o inventario nao e atualizado
#   avisa: PR automation/inventario-estado com o inventario novo
name: Inventário do estado real (semanal)

# Refaz inventario/estado/ (rotas do front, edge functions e — se houver token — o banco oficial em
# somente leitura) a partir do código e abre PR se algo mudou.
# Scripts: scripts/inventario/gerar-rotas.mjs, gerar-repo.mjs e gerar-banco.mjs.
# Nunca faz push direto em main — entrega via PR na branch automation/inventario-estado.
#
# Secrets:
#   - SUPABASE_ACCESS_TOKEN (opcional, ainda NÃO configurado neste repo): token de uso pessoal da
#     Management API do projeto iecgydonctmabiijadsf, só leitura aqui (POST
#     /database/query/read-only e GET /functions). Sem ele o passo do banco é pulado com aviso e o
#     workflow segue gerando rotas.json e edges.json — nada fica vermelho por falta de token.
#
# Observação: PR aberta com o GITHUB_TOKEN não dispara o ci.yml (regra do GitHub). Quem for mergear
# reabre/fecha a PR ou roda o CI à mão; a `main` deste repo não tem required check.

on:
  schedule:
    - cron: '37 9 * * 1' # segunda 09:37 UTC (06:37 BRT)
  workflow_dispatch:

concurrency:
  group: inventario-estado-semanal
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  gerar:
    name: Refazer inventario/estado
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:  # zizmor: ignore[excessive-permissions]
      contents: write       # branch do PR
      pull-requests: write  # abrir/atualizar o PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Instalar ripgrep (usado pelo gerar-repo.mjs)
        run: command -v rg || sudo apt-get install -y --no-install-recommends ripgrep

      - name: Inventário do repositório (rotas e edge functions)
        run: |
          node scripts/inventario/gerar-rotas.mjs
          # < /dev/null: sem lista de tabelas no stdin o script só grava edges.json
          node scripts/inventario/gerar-repo.mjs < /dev/null

      - name: Inventário do banco (somente leitura, só com token)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ausente: banco.json não foi regerado (só rotas.json e edges.json)."
            exit 0
          fi
          node scripts/inventario/gerar-banco.mjs

      - name: Decidir se vale PR
        id: mudou
        # Compara o JSON sem os carimbos de data (medido_em/gerado_em) e sem a telemetria de janela
        # rolante, arquivo a arquivo contra o HEAD. Filtrar linhas do diff não serve: o edges.json é
        # gravado numa linha só, com a data.
        run: |
          valor="$(node scripts/inventario/mudou-conteudo.mjs)"
          echo "valor=$valor" >> "$GITHUB_OUTPUT"
          if [ "$valor" != "true" ]; then
            echo "Inventário sem mudança de conteúdo — nenhum PR a abrir."
          fi

      - name: Abrir ou atualizar PR do inventário
        id: pull-request
        if: steps.mudou.outputs.valor == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/inventario-estado
          delete-branch: true
          commit-message: 'chore(inventario): estado real do repo e do banco [auto]'
          title: 'chore(inventario): estado real (semanal)'
          body: |
            Inventário refeito automaticamente por `.github/workflows/inventario-estado-semanal.yml`:
            código do repo (rotas e edge functions) + banco oficial em somente leitura quando há
            `SUPABASE_ACCESS_TOKEN`. Só arquivos em `inventario/estado/`.

            - main de origem: `${{ github.sha }}`
            - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Como ler cada arquivo: `inventario/estado/README.md`.
          labels: inventario
          add-paths: |
            inventario/estado/banco.json
            inventario/estado/rotas.json
            inventario/estado/edges.json

      - name: Upload do inventário
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventario-estado-${{ github.run_id }}
          path: inventario/estado/
          retention-days: 14
