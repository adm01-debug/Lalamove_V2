name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
        # O tsconfig.json da raiz tem "files": [] e so referencia os projetos,
        # entao `tsc --noEmit` sem -p compilava ZERO arquivo (check verde-falso:
        # a main acumulou 24 erros de tipo sem a CI acusar). Compilar o projeto
        # do app e o do Node explicitamente.
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsc --noEmit -p tsconfig.node.json

  test:
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7



  build:
    runs-on: ubuntu-24.04
    needs: [test, contract-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  guard-agents-md:
    name: Guarda AGENTS.md / docs/agentes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Confere integridade das instrucoes para agentes
        run: |
          git fetch origin main --quiet || true
          CLAUDE_MD_BASE=origin/main node scripts/ci/check-agents-md-integrity.mjs
      - name: Testa o lint de mensagem de commit
        run: node --test scripts/ci/*.unit.mjs

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=critical

  contract-tests:
    name: Deno Contract Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Run Edge Function contract tests (in-memory)
        run: |
          deno test --allow-net --allow-env \
            supabase/functions/_shared/contract.test.ts \
            supabase/functions/_shared/template.test.ts \
            supabase/functions/lalamove-webhook/security.test.ts \
            supabase/functions/lalamove-gateway/route.test.ts
      # geo-gateway concentra cache, orcamento e rate guard: sem estes testes no CI
      # uma regressao de custo so aparece na fatura do Mapbox.
      - name: Run geo-gateway tests (resolver, metering, polyline, provider)
        run: deno test --allow-all supabase/functions/geo-gateway/
      # Motor de comunicacao (etapas 88-95 do plano de mensageria): idempotencia,
      # fallback temporizado e imediato, silencio noturno por papel e limite por
      # motorista. Regressao aqui manda 20 SMS em rajada ou cala o motorista as 3h.
      - name: Run messaging router tests
        run: deno test supabase/functions/_shared/messaging/
      # job-worker, send-notification e lalamove-api tinham testes no repo que
      # nenhum workflow executava: ETA, cadencia, replay de trajeto, opt-out e
      # fallback de geocode podiam quebrar sem o CI ficar vermelho.
      - name: Run job-worker, send-notification and lalamove-api tests
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/job-worker/ \
            supabase/functions/send-notification/ \
            supabase/functions/lalamove-api/
      # Etapa 53 do plano Mapbox: replay deterministico do trajeto.
      - name: Run driver movement replay tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/simulate-driver-movement/

  sql-geo-tests:
    name: SQL Geo Trigger Tests
    runs-on: ubuntu-24.04
    # O trigger geo_evaluate_tracking e o codigo que decide aproximacao, chegada,
    # avanco de parada e atraso. Nenhum outro job executa SQL, entao uma regressao
    # aqui (ex.: next_stop_index que nao avanca, ETA_DELAY que nunca dispara) so
    # apareceria com o motorista na rua. Este job roda o harness de verdade.
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: x
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: x
    steps:
      - uses: actions/checkout@v7
      - name: Run SQL geo trigger harness
        run: bash supabase/tests/run.sh

  edge-integration-tests:
    name: Deno Edge Function I/O Integration Tests
    runs-on: ubuntu-24.04
    # Testes de I/O reais chamam as Edge Functions IMPLANTADAS; sÃ³ rodam quando
    # os secrets do ambiente estÃ£o disponÃ­veis (push na main).
    if: github.ref == 'refs/heads/main'
    needs: contract-tests
    steps:
      - uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Write .env for integration tests
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          # .env.example exige estas vars (dotenv/load.ts do Deno valida presenca); o teste de integracao nao as le, so precisam existir.
          echo "SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=dummy-not-used-by-tests" >> .env
      - name: Run Edge Function I/O integration tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/_shared/contract.integration.test.ts

  geo-sql-tests:
    name: Geo geometry SQL tests
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Create geometry functions from the geo_foundation migration
        env:
          PGPASSWORD: postgres
        run: |
          # Só as funções puras de geometria: elas não dependem de auth/alert_type,
          # então rodam num Postgres limpo. Etapa 17 do plano Google Maps.
          sed -n '277,345p' supabase/migrations/20261122130100_geo_foundation.sql \
            | psql -h localhost -U postgres -d geotest -q -v ON_ERROR_STOP=1
      - name: Run known-value asserts
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d geotest -v ON_ERROR_STOP=1 -f supabase/tests/geo_functions.test.sql

  geo-trigger-sql-tests:
    name: Geo trigger SQL tests
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Create the schema the geo trigger depends on
        env:
          PGPASSWORD: postgres
        run: |
          # O trigger geo_evaluate_tracking toca lalamove_orders, active_tracking,
          # alerts e job_queue, então precisa de um schema mínimo antes das
          # funções da migration. Etapa 64 do plano Google Maps.
          MIG=supabase/migrations/20261122130100_geo_foundation.sql
          psql -h localhost -U postgres -d geotest -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/fixtures/geo_trigger_schema.sql
          for range in 277,341 347,387 389,533; do
            sed -n "${range}p" "$MIG" \
              | psql -h localhost -U postgres -d geotest -q -v ON_ERROR_STOP=1
          done
      - name: Run geo trigger behaviour asserts
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d geotest -v ON_ERROR_STOP=1 -f supabase/tests/geo_trigger.test.sql

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Deploy Edge Functions
        run: echo "Deploy automÃ¡tico via Lovable"

