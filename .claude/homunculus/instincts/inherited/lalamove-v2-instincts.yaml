# Lalamove V2 Test Placement

## Action

Teste de unidade ao lado do módulo (`__tests__/` ou `*.test.ts(x)`), rodado com
`npx vitest run <caminho>`. E2E em `e2e/*.e2e.ts` (Playwright). Contrato de edge em Deno
(`supabase/functions/**/*.test.ts`).

## Evidence

- `vitest.config.ts`: `include: ["src/**/*.{test,spec}.{ts,tsx}"]`
- `playwright.config.ts`: `testDir: './e2e'`, `testMatch: '**/*.e2e.ts'`
- `.github/workflows/ci.yml`: job `contract-tests` roda `deno test` em `_shared/contract.test.ts`

