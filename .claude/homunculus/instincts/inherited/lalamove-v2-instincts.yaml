# Lalamove V2 Branch Naming

## Action

Branch de agente: `claude/<fix|feat|chore|infra>-<slug>-<AAMMDD-HHMM>`, sempre a partir de `main`
atualizado. Nunca commitar em `main` (não há branch protection) nem escrever em branch alheia.

## Evidence

- `AGENTS.md` > Fluxo Git
- `github_list_branches`: 25 branches, incluindo lixo de sessões antigas (`master`, `lovable-sync-*`)

