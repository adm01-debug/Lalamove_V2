# Lalamove V2 No Secrets In Code

## Action

Nunca escreva chave em arquivo: segredo de back-end vive em secret de edge function; o front só pode ler
`VITE_*` (público). Script novo lê de `process.env`.

## Evidence

- `docs/agentes/banco.md` > Segredos commitados (13 arquivos com `service_role`, 6 com PAT `sbp_…`,
  `supabase/functions/migrate-helper/index.ts:5` com chave fixa) — passivo a corrigir, não padrão a seguir
