# Lalamove V2 Naming Files

## Action

Página: `NomePage.tsx` em `src/pages/`. Hook: `useNome.ts` em `src/hooks/`. Componente: `PascalCase.tsx`
na pasta do domínio. Edge function: pasta `kebab-case/index.ts` em `supabase/functions/`.

## Evidence

- `src/pages/` (54 arquivos `*Page.tsx`), `src/hooks/` (82 `use*.ts`), `supabase/functions/` (27 pastas)

