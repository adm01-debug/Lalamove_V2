# Lalamove V2 Commit Conventional

## Action

Use Conventional Commits em PT-BR: `<tipo>(<escopo>): <assunto>`, assunto com >= 10 caracteres e sem ponto
final. Tipos aceitos: feat fix docs style refactor perf test build ci chore security revert.

## Evidence

- `scripts/ci/commit-msg-lint.mjs` (gate do padrão; sem hook instalado, rode à mão)
- `docs/CONTRIBUTING.md` > Commit
- Histórico da `main`: `build(deps): bump …`, `fix: …`, `feat: …`

