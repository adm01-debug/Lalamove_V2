# Lalamove V2 Import Alias

## Action

Importe módulo do projeto pelo alias `@/` (ex.: `import { supabase } from "@/integrations/supabase/client"`),
não por caminho relativo longo.

## Evidence

- `vite.config.ts` e `tsconfig.app.json` definem `@/* -> ./src/*`
- `src/components/auth/ProtectedRoute.tsx` importa `@/hooks/useAuth`

